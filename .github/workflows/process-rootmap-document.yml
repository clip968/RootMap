name: Process RootMap Document

on:
  workflow_dispatch:
    inputs:
      document_id:
        description: "RootMap document_id returned after PDF upload"
        required: true
        type: string
      chunk_batch_size:
        description: "Number of pending chunks to process in one CLI run"
        required: true
        default: "3"
        type: string
      max_attempts:
        description: "Maximum repeated CLI runs before the workflow stops"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Process uploaded document
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DOCUMENT_BUCKET: rootmap-documents
          LLM_SETTINGS_SECRET: ${{ secrets.LLM_SETTINGS_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          OPENROUTER_TIMEOUT_MS: "90000"
          OPENROUTER_MAX_ATTEMPTS: "2"
          DOCUMENT_CHUNK_CONCURRENCY: "1"
          DOCUMENT_ID: ${{ inputs.document_id }}
          CHUNK_BATCH_SIZE: ${{ inputs.chunk_batch_size }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        run: |
          # The local runner intentionally processes a small batch and checkpoints progress.
          # Re-running with --resume continues from the saved document/chunk state.
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Attempt $attempt / $MAX_ATTEMPTS for document $DOCUMENT_ID"

            npm run document:process-local -- \
              --document-id "$DOCUMENT_ID" \
              --resume \
              --chunk-batch-size "$CHUNK_BATCH_SIZE" | tee "process-$attempt.log"

            if grep -q '"processing_status_after": "tree_generated"' "process-$attempt.log"; then
              echo "Document processing completed. Check the JSON log above for tree_id."
              exit 0
            fi
          done

          echo "Document was not fully processed within MAX_ATTEMPTS. Re-run this workflow with the same document_id."
          exit 1
